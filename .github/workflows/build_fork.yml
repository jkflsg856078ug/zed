name: Build Fork Binaries (Fast)

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:
  pull_request:
    branches:
      - 'claude/**'

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '1'
  RUST_BACKTRACE: '1'

jobs:
  build_windows_binaries:
    name: Build Windows Binaries
    runs-on: windows-latest
    steps:
      - name: Enable long paths
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
        shell: pwsh

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Build Zed and CLI (parallel)
        run: cargo build --release --package zed --package cli --target x86_64-pc-windows-msvc
        shell: pwsh

      - name: Build remote_server
        run: cargo build --release --package remote_server --target x86_64-pc-windows-msvc
        shell: pwsh

      - name: Package binaries
        run: |
          New-Item -ItemType Directory -Path "zed-windows" -Force
          Copy-Item "target/x86_64-pc-windows-msvc/release/zed.exe" "zed-windows/"
          Copy-Item "target/x86_64-pc-windows-msvc/release/cli.exe" "zed-windows/"
          Copy-Item "target/x86_64-pc-windows-msvc/release/remote_server.exe" "zed-windows/"
          Compress-Archive -Path "zed-windows/*" -DestinationPath "zed-windows-x86_64.zip"
        shell: pwsh

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries-x86_64
          path: zed-windows-x86_64.zip

  build_linux_remote_server:
    name: Build Linux Remote Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install minimal dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools clang libssl-dev pkg-config
        shell: bash

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl
          cache: true

      - name: Build remote server (static)
        run: |
          export RUSTFLAGS="-C target-feature=+crt-static"
          cargo build --release --target x86_64-unknown-linux-musl --package remote_server
        shell: bash

      - name: Compress remote server
        run: gzip -f --stdout --best target/x86_64-unknown-linux-musl/release/remote_server > zed-remote-server-linux-x86_64.gz

      - name: Upload remote server
        uses: actions/upload-artifact@v4
        with:
          name: linux-remote-server-x86_64
          path: zed-remote-server-linux-x86_64.gz

  build_linux_zed:
    name: Build Linux Zed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc g++ libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libssl-dev libzstd-dev libvulkan1 make cmake clang mold

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Build Zed and CLI
        run: cargo build --release --package zed --package cli
        shell: bash

      - name: Package binaries
        run: |
          mkdir -p zed-linux
          cp target/release/zed zed-linux/
          cp target/release/cli zed-linux/
          tar -czf zed-linux-x86_64.tar.gz -C zed-linux .

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-zed-x86_64
          path: zed-linux-x86_64.tar.gz
