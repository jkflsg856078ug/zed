name: Build Fork Binaries (Fast)

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:
  pull_request:
    branches:
      - 'claude/**'

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '1'
  RUST_BACKTRACE: '1'
  RUSTFLAGS: '-A unused'

jobs:
  build_windows_binaries:
    name: Build Windows Binaries
    runs-on: windows-latest
    steps:
      - name: Enable long paths
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
        shell: pwsh

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: windows-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-cargo-registry-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target/
          key: windows-target-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/*.rs') }}
          restore-keys: |
            windows-target-${{ hashFiles('**/Cargo.lock') }}-
            windows-target-

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false

      - name: Build Zed and CLI (parallel)
        run: cargo build --release --package zed --package cli --target x86_64-pc-windows-msvc
        shell: pwsh

      - name: Build remote_server
        run: cargo build --release --package remote_server --target x86_64-pc-windows-msvc
        shell: pwsh

      - name: Package binaries
        run: |
          New-Item -ItemType Directory -Path "zed-windows" -Force
          Copy-Item "target/x86_64-pc-windows-msvc/release/zed.exe" "zed-windows/"
          Copy-Item "target/x86_64-pc-windows-msvc/release/cli.exe" "zed-windows/"
          Copy-Item "target/x86_64-pc-windows-msvc/release/remote_server.exe" "zed-windows/"
          Compress-Archive -Path "zed-windows/*" -DestinationPath "zed-windows-x86_64.zip"
        shell: pwsh

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries-x86_64
          path: zed-windows-x86_64.zip

  build_linux_remote_server:
    name: Build Linux Remote Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: linux-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            linux-cargo-registry-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target/
          key: linux-musl-target-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/*.rs') }}
          restore-keys: |
            linux-musl-target-${{ hashFiles('**/Cargo.lock') }}-
            linux-musl-target-

      - name: Install minimal dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools clang libssl-dev pkg-config
        shell: bash

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl
          cache: false

      - name: Build remote server (static)
        run: |
          export RUSTFLAGS="-C target-feature=+crt-static"
          cargo build --release --target x86_64-unknown-linux-musl --package remote_server
        shell: bash

      - name: Compress remote server
        run: gzip -f --stdout --best target/x86_64-unknown-linux-musl/release/remote_server > zed-remote-server-linux-x86_64.gz

      - name: Upload remote server
        uses: actions/upload-artifact@v4
        with:
          name: linux-remote-server-x86_64
          path: zed-remote-server-linux-x86_64.gz
