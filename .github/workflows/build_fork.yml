name: Build Fork Binaries

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:
  pull_request:
    branches:
      - 'claude/**'

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

jobs:
  build_windows_binaries:
    name: Build Windows Binaries
    runs-on: windows-latest
    steps:
      - name: Enable long paths
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
        shell: pwsh

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup environment
        run: |
          $version = & ./script/get-crate-version.ps1 zed
          echo "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          $channel = Get-Content "crates/zed/RELEASE_CHANNEL"
          echo "ZED_RELEASE_CHANNEL=$channel" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Generate licenses
        run: ./script/generate-licenses.ps1
        shell: pwsh
        continue-on-error: true

      - name: Build Zed binaries
        run: |
          cargo build --release --package zed --package cli --target x86_64-pc-windows-msvc
        shell: pwsh

      - name: Build remote_server
        run: |
          cargo build --release --package remote_server --target x86_64-pc-windows-msvc
        shell: pwsh

      - name: Create archive
        run: |
          $version = $env:RELEASE_VERSION
          $channel = $env:ZED_RELEASE_CHANNEL
          New-Item -ItemType Directory -Path "zed-windows" -Force
          Copy-Item "target/x86_64-pc-windows-msvc/release/zed.exe" "zed-windows/"
          Copy-Item "target/x86_64-pc-windows-msvc/release/cli.exe" "zed-windows/"
          Copy-Item "target/x86_64-pc-windows-msvc/release/remote_server.exe" "zed-windows/"
          Compress-Archive -Path "zed-windows/*" -DestinationPath "zed-windows-x86_64.zip"
        shell: pwsh

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries-x86_64
          path: |
            zed-windows-x86_64.zip
            target/x86_64-pc-windows-msvc/release/zed.exe
            target/x86_64-pc-windows-msvc/release/cli.exe
            target/x86_64-pc-windows-msvc/release/remote_server.exe

  build_linux_remote_server:
    name: Build Linux Remote Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install system dependencies
        run: ./script/linux
        shell: bash

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Generate licenses
        run: ./script/generate-licenses

      - name: Build remote server
        run: |
          export RUSTFLAGS="-C target-feature=+crt-static"
          cargo build --release --target x86_64-unknown-linux-musl --package remote_server
        shell: bash

      - name: Compress remote server
        run: |
          gzip -f --stdout --best target/x86_64-unknown-linux-musl/release/remote_server > zed-remote-server-linux-x86_64.gz
        shell: bash

      - name: Upload remote server
        uses: actions/upload-artifact@v4
        with:
          name: linux-remote-server-x86_64
          path: zed-remote-server-linux-x86_64.gz

  build_linux_full:
    name: Build Linux Full Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install system dependencies
        run: ./script/linux
        shell: bash

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Generate licenses
        run: ./script/generate-licenses

      - name: Build Linux bundle
        run: ./script/bundle-linux
        shell: bash
        continue-on-error: true

      - name: List build artifacts
        run: |
          find target/release -type f -name "*.tar.gz" -o -name "*.gz" | head -20
        shell: bash

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: linux-package-x86_64
          path: |
            target/release/*.tar.gz
            target/release/*.gz
          if-no-files-found: warn
